name: Stage npm package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact existing Git tag to stage (for example, v1.0.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag without publishing credentials
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and validate immutable release commit
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          node --input-type=module -e "
            import packageJson from './package.json' with { type: 'json' };
            const expected = 'v' + packageJson.version;
            if (process.env.RELEASE_TAG !== expected) {
              throw new Error('release tag ' + process.env.RELEASE_TAG + ' must equal ' + expected);
            }
          "
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          test "$head_commit" = "$tag_commit"
          echo "sha=$head_commit" >> "$GITHUB_OUTPUT"
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run release checks
        run: pnpm release:check

  stage:
    name: Stage verified source on npm
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with staged publishing support
        run: |
          npm install --global npm@11.15.0
          test "$(npm --version)" = "11.15.0"
      - name: Confirm the release tag still identifies the verified commit
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERIFIED_SHA: ${{ needs.verify.outputs.release_sha }}
        run: |
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          test "$tag_commit" = "$VERIFIED_SHA"
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
      - name: Choose npm distribution tag
        id: dist
        run: |
          node --input-type=module -e "
            import { appendFileSync } from 'node:fs';
            import packageJson from './package.json' with { type: 'json' };
            const tag = packageJson.version.includes('-') ? 'next' : 'latest';
            appendFileSync(process.env.GITHUB_OUTPUT, 'tag=' + tag + '\n');
          "
      - name: Stage package for maintainer approval
        run: npm stage publish --ignore-scripts --tag "${{ steps.dist.outputs.tag }}"
